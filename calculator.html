<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1e1e1e;
            font-family: Arial, sans-serif;
        }

        .calculator {
            background: #2c2c2c;
            padding: 20px;
            border-radius: 10px;
            width: 260px;
        }

        .display {
            width: 100%;
            height: 50px;
            background: #000;
            color: #0f0;
            font-size: 24px;
            text-align: right;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #444;
            color: white;
        }

        button:hover {
            background-color: #666;
        }

        .operator {
            background-color: #ff9500;
        }

        .operator:hover {
            background-color: #e08900;
        }

        .clear {
            background-color: #ff3b30;
            grid-column: span 2;
        }

        .equal {
            background-color: #34c759;
            grid-column: span 2;
        }
    </style>
</head>
<body>

<div class="calculator">
    <div id="display" class="display">0</div>

    <div class="buttons">
        <button class="clear">C</button>
        <button class="operator">/</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operator">*</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operator">-</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operator">+</button>

        <button>0</button>
        <button>.</button>
        <button class="equal">=</button>
    </div>
</div>

<script>
    const display = document.getElementById("display");
    const buttons = document.querySelectorAll("button");

    let currentInput = "";
    let operator = "";
    let firstValue = "";

    buttons.forEach(button => {
        button.addEventListener("click", () => {
            const value = button.textContent;

            if (value === "C") {
                currentInput = "";
                firstValue = "";
                operator = "";
                display.textContent = "0";
            }
            else if (value === "=") {
                if (firstValue !== "" && operator !== "") {
                    currentInput = eval(firstValue + operator + currentInput);
                    display.textContent = currentInput;
                    firstValue = "";
                    operator = "";
                }
            }
            else if (value === "+" || value === "-" || value === "*" || value === "/") {
                firstValue = currentInput;
                operator = value;
                currentInput = "";
            }
            else {
                currentInput += value;
                display.textContent = currentInput;
            }
        });
    });
</script>

</body>
</html>
